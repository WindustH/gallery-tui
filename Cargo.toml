[package]
name = "gallery-tui"
version = "0.2.13"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "A terminal image gallery powered by ratatui and chafa"

[workspace]
members = [
  ".",
  "crates/framework-tui",
  "crates/img-tui",
]
resolver = "3"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
framework-tui = { path = "crates/framework-tui", features = ["serde"] }
hex = "0.4.3"
humansize = "2.1.3"
image = "0.25.10"
img-tui = { path = "crates/img-tui", features = ["cache", "terminal", "chafa"] }
kamadak-exif = "0.6.1"
libc = "0.2.186"
ratatui = "0.30.2"
resvg = "0.45"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
usvg = "0.45.1"
walkdir = "2.5.0"
zstd = { version = "0.13.3", features = ["zstdmt"] }


[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"

[[bin]]
name = "gallery-tui"
path = "src/main.rs"
test = false

[patch."https://github.com/WindustH/framework-tui"]
framework-tui = { path = "crates/framework-tui" }
